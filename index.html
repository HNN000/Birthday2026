<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 🎉祝陈奕童生日快乐🎉 </title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Floating decorative elements -->
        <div class="floater floater-1"> ✨ </div>
        <div class="floater floater-2"> 🌊 </div>
        <div class="floater floater-3"> ⭐ </div>
        <div class="floater floater-4"> 🌌 </div>

        <!-- Header with pixel art animation -->
        <header>
            <div class="pixel-art-header">
                <div class="pixel-char walking"></div>
                <h1 class="title glitch"> 🎉祝陈奕童生日快乐🎉 </h1>
                <div class="pixel-char-right walking-right"></div>
            </div>
            <p class="subtitle"> 我们的旅途✨ </p>
        </header>

        <!-- Days Counter -->
        <section class="days-counter">
            <div class="counter-card">
                <div class="counter-label"> 我们认识了 </div>
                <div class="counter-value" id="daysCounter">loading...</div>
                <div class="counter-label"> 天 </div>
            </div>
        </section>

        <!-- Photo Gallery Section -->
        <section class="gallery-section">
            <h2 class="section-title"> 📸我们的照片 </h2>
            <div class="gallery-grid" id="galleryGrid">
                <!-- Gallery items will be added here -->
            </div>
        </section>

        <!-- Animated pixel characters -->
        <div class="character-decoration char-left"> 🐟 </div>
        <div class="character-decoration char-right"> 🥄 </div>

        <!-- Footer with particle animation -->
        <footer>
            <p>Created with love 💚 | Configuration in <code>config.js</code></p>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
